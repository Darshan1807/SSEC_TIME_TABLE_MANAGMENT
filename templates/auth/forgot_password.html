{% extends "base.html" %}

{% block title %}Forgot Password - SSEC IT Timetable System{% endblock %}

{% block content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
      <div class="auth-card p-4 p-sm-5">
        
        <div class="text-center mb-4">
          <div class="d-inline-flex p-3 rounded-circle bg-warning bg-opacity-10 text-warning mb-2">
            <i class="bi bi-key-fill fs-2"></i>
          </div>
          <h3 class="fw-bold text-dark mb-1">Forgot Password?</h3>
          <p class="text-muted small">Enter your registered email address.</p>
        </div>

        <form method="POST" action="{{ url_for('auth.forgot_password') }}">
          <!-- Role Selection (Optional hint) -->
          <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary">Account Role</label>
            <div class="row g-2">
              <div class="col-6">
                <input type="radio" class="btn-check" name="role" id="forgot_role_student" value="student" checked>
                <label class="btn btn-outline-primary btn-sm w-100 py-1.5 rounded-3 text-center" for="forgot_role_student">
                  <i class="bi bi-mortarboard me-1"></i> Student
                </label>
              </div>
              <div class="col-6">
                <input type="radio" class="btn-check" name="role" id="forgot_role_professor" value="professor">
                <label class="btn btn-outline-success btn-sm w-100 py-1.5 rounded-3 text-center" for="forgot_role_professor">
                  <i class="bi bi-person-video3 me-1"></i> Professor
                </label>
              </div>
            </div>
          </div>

          <!-- Email Input -->
          <div class="mb-4">
            <label class="form-label small fw-semibold text-secondary">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
              <input type="email" name="email" required autofocus class="form-control" placeholder="Enter your registered email">
            </div>
            <div class="form-text text-muted small">We will verify your account and send a 6-digit password reset OTP.</div>
          </div>

          <button type="submit" class="btn btn-ssec w-100 py-2">
            <i class="bi bi-send me-1"></i> Get OTP
          </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
          <a href="{{ url_for('auth.login') }}" class="small text-muted text-decoration-none">
            <i class="bi bi-arrow-left me-1"></i> Remember password? Back to Login
          </a>
        </div>

      </div>
    </div>
  </div>
</div>
{% endblock %}
