{% extends "base.html" %}

{% block title %}Create New Password - SSEC IT Timetable System{% endblock %}

{% block content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
      <div class="auth-card p-4 p-sm-5">
        
        <div class="text-center mb-4">
          <div class="d-inline-flex p-3 rounded-4 bg-success bg-opacity-10 text-success mb-2">
            <i class="bi bi-key-fill fs-2"></i>
          </div>
          <h3 class="fw-bold text-dark mb-1">Create New Password</h3>
          <p class="text-muted small">Enter and confirm your new secure password</p>
        </div>

        <form method="POST" action="{{ url_for('auth.reset_password') }}">
          <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary">New Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
              <input type="password" name="new_password" required autofocus class="form-control" placeholder="Min 4 characters">
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label small fw-semibold text-secondary">Confirm New Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-shield-check"></i></span>
              <input type="password" name="confirm_password" required class="form-control" placeholder="Re-type new password">
            </div>
          </div>

          <button type="submit" class="btn btn-ssec w-100 py-2">
            <i class="bi bi-check2-circle me-1"></i> Reset Password
          </button>
        </form>

      </div>
    </div>
  </div>
</div>
{% endblock %}
