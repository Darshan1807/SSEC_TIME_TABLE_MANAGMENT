{% extends "base.html" %}

{% block title %}Verify OTP - Password Reset - SSEC IT{% endblock %}

{% block content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
      <div class="auth-card p-4 p-sm-5 text-center">
        
        <div class="d-inline-flex p-3 rounded-circle bg-warning bg-opacity-10 text-warning mb-3">
          <i class="bi bi-shield-check fs-1"></i>
        </div>

        <h3 class="fw-bold text-dark mb-1">Verify OTP</h3>
        <p class="text-muted small mb-1">We sent an OTP to</p>
        <div class="badge bg-light text-dark border px-3 py-2 fs-6 fw-mono mb-4">
          {{ masked_email or email }}
        </div>

        <form method="POST" action="{{ url_for('auth.verify_reset_otp') }}" id="reset-otp-form">
          <div class="mb-4">
            <label class="form-label small fw-bold text-secondary text-uppercase tracking-wide mb-3">
              Enter OTP
            </label>
            
            <!-- 6-digit OTP input boxes -->
            <div class="otp-inputs mb-2" id="reset-otp-box-container">
              <input type="text" maxlength="1" class="otp-box" autofocus required data-index="0">
              <input type="text" maxlength="1" class="otp-box" required data-index="1">
              <input type="text" maxlength="1" class="otp-box" required data-index="2">
              <input type="text" maxlength="1" class="otp-box" required data-index="3">
              <input type="text" maxlength="1" class="otp-box" required data-index="4">
              <input type="text" maxlength="1" class="otp-box" required data-index="5">
            </div>
            
            <input type="hidden" name="otp" id="reset_final_otp_input">
          </div>

          <!-- JavaScript Countdown Timer -->
          <div class="mb-4">
            <div class="text-muted small d-flex align-items-center justify-content-center gap-1">
              <i class="bi bi-clock-history text-secondary"></i>
              <span>Expires in:</span>
              <span id="reset-countdown-timer" class="fw-bold text-danger font-monospace fs-6">05:00</span>
            </div>
          </div>

          <button type="submit" id="reset-verify-btn" class="btn btn-ssec w-100 py-2">
            <i class="bi bi-check-circle me-1"></i> Verify OTP
          </button>
        </form>

        <!-- Resend OTP Form -->
        <div class="mt-4 pt-3 border-top">
          <form method="POST" action="{{ url_for('auth.resend_reset_otp') }}">
            <button type="submit" id="reset-resend-btn" class="btn btn-outline-secondary btn-sm rounded-pill px-3" disabled>
              <i class="bi bi-arrow-repeat me-1"></i> Resend OTP (<span id="reset-resend-timer">60</span>s)
            </button>
          </form>
        </div>

        <div class="mt-3">
          <a href="{{ url_for('auth.forgot_password') }}" class="small text-muted text-decoration-none">
            <i class="bi bi-arrow-left me-1"></i> Change Email Address
          </a>
        </div>

      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const inputs = document.querySelectorAll('.otp-box');
  const finalInput = document.getElementById('reset_final_otp_input');
  const form = document.getElementById('reset-otp-form');

  inputs.forEach((input, index) => {
    input.addEventListener('input', (e) => {
      const val = e.target.value.replace(/\D/g, '');
      e.target.value = val ? val[0] : '';
      updateFinalOtp();
      if (val && index < inputs.length - 1) {
        inputs[index + 1].focus();
      }
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !e.target.value && index > 0) {
        inputs[index - 1].focus();
      }
    });

    input.addEventListener('paste', (e) => {
      e.preventDefault();
      const pasteData = (e.clipboardData || window.clipboardData).getData('text').trim();
      const digits = pasteData.replace(/\D/g, '').slice(0, 6);
      digits.split('').forEach((d, i) => {
        if (inputs[i]) inputs[i].value = d;
      });
      updateFinalOtp();
      if (digits.length >= 6) {
        inputs[5].focus();
      }
    });
  });

  function updateFinalOtp() {
    let combined = '';
    inputs.forEach(inp => combined += inp.value);
    finalInput.value = combined;
  }

  form.addEventListener('submit', (e) => {
    updateFinalOtp();
    if (finalInput.value.length !== 6) {
      e.preventDefault();
      alert('Please enter all 6 digits of the OTP.');
    }
  });

  // 5-Minute OTP Expiry Countdown
  let timeLeft = 300;
  const timerDisplay = document.getElementById('reset-countdown-timer');
  const verifyBtn = document.getElementById('reset-verify-btn');

  const expiryInterval = setInterval(() => {
    timeLeft--;
    if (timeLeft <= 0) {
      clearInterval(expiryInterval);
      timerDisplay.textContent = '00:00 (Expired)';
      verifyBtn.disabled = true;
      verifyBtn.classList.add('disabled');
    } else {
      const mins = String(Math.floor(timeLeft / 60)).padStart(2, '0');
      const secs = String(timeLeft % 60).padStart(2, '0');
      timerDisplay.textContent = `${mins}:${secs}`;
    }
  }, 1000);

  // 60-Second Resend Cooldown
  let resendTime = 60;
  const resendBtn = document.getElementById('reset-resend-btn');
  const resendTimerSpan = document.getElementById('reset-resend-timer');

  const resendInterval = setInterval(() => {
    resendTime--;
    if (resendTime <= 0) {
      clearInterval(resendInterval);
      resendBtn.disabled = false;
      resendBtn.innerHTML = '<i class="bi bi-arrow-repeat me-1"></i> Resend OTP';
      resendBtn.classList.remove('btn-outline-secondary');
      resendBtn.classList.add('btn-outline-primary');
    } else {
      resendTimerSpan.textContent = resendTime;
    }
  }, 1000);
</script>
{% endblock %}
