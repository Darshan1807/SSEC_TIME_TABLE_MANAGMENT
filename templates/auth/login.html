{% extends "base.html" %}

{% block title %}Sign In - SSEC IT Timetable System{% endblock %}

{% block content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
      <div class="auth-card p-4 p-sm-5">
        
        <div class="text-center mb-4">
          <div class="d-inline-flex p-3 rounded-4 bg-info bg-opacity-10 text-primary mb-2">
            <i class="bi bi-person-badge fs-2"></i>
          </div>
          <h3 class="fw-bold text-dark mb-1">Account Sign In</h3>
          <p class="text-muted small">Access your personalized timetable & schedules</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}">
          <!-- Role Selection -->
          <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary">Select Role</label>
            <div class="row g-2">
              <div class="col-6">
                <input type="radio" class="btn-check" name="role" id="role_student" value="student" checked onchange="toggleRoleFields('student')">
                <label class="btn btn-outline-primary w-100 py-2 rounded-3 text-center" for="role_student">
                  <i class="bi bi-mortarboard d-block fs-5"></i>
                  <span class="small fw-bold">Student</span>
                </label>
              </div>
              <div class="col-6">
                <input type="radio" class="btn-check" name="role" id="role_professor" value="professor" onchange="toggleRoleFields('professor')">
                <label class="btn btn-outline-success w-100 py-2 rounded-3 text-center" for="role_professor">
                  <i class="bi bi-person-video3 d-block fs-5"></i>
                  <span class="small fw-bold">Professor</span>
                </label>
              </div>
            </div>
          </div>

          <!-- Student Identifier -->
          <div class="mb-3" id="student_id_group">
            <label class="form-label small fw-semibold text-secondary">Enrollment Number or Email</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-card-text"></i></span>
              <input type="text" name="enrollment_no" class="form-control" placeholder="e.g. 200010116001 or student@ssec.ac.in">
            </div>
          </div>

          <!-- Professor Identifier -->
          <div class="mb-3 d-none" id="prof_id_group">
            <label class="form-label small fw-semibold text-secondary">Professor ID or Email</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-person-vcard"></i></span>
              <input type="text" name="professor_id" class="form-control" placeholder="e.g. PROF_IT_01 or prof@ssec.ac.in">
            </div>
          </div>

          <!-- Password Field -->
          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="form-label small fw-semibold text-secondary mb-0">Password</label>
              <a href="{{ url_for('auth.forgot_password') }}" class="small text-decoration-none text-primary fw-semibold">
                Forgot Password?
              </a>
            </div>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
              <input type="password" name="password" required class="form-control" placeholder="Enter account password">
            </div>
          </div>

          <button type="submit" class="btn btn-ssec w-100 mt-2">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
          </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
          <span class="text-muted small">Don't have an account?</span>
          <a href="{{ url_for('auth.register') }}" class="small fw-bold text-primary text-decoration-none ms-1">
            Register Account with Email OTP
          </a>
        </div>

      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  function toggleRoleFields(role) {
    const studentGroup = document.getElementById('student_id_group');
    const profGroup = document.getElementById('prof_id_group');
    if (role === 'student') {
      studentGroup.classList.remove('d-none');
      profGroup.classList.add('d-none');
    } else {
      studentGroup.classList.add('d-none');
      profGroup.classList.remove('d-none');
    }
  }
</script>
{% endblock %}
